<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17211d">
<title>Suivi coût maison</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coût Maison">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f4f2ec;--panel:#ffffff;--text:#18201c;--muted:#6c746f;--line:#e4e0d7;
  --green:#1f6b4f;--green2:#e8f2ed;--gold:#ae8748;--gold2:#f6efe2;--red:#a13f3f;
  --shadow:0 10px 30px rgba(28,34,31,.08);--radius:18px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:rgba(244,242,236,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1250px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.brand{min-width:0;flex:1}
.brand h1{font-size:19px;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#e9e7e0;color:var(--text)}
.btn.primary{background:var(--green);color:white}
.btn.gold{background:var(--gold);color:white}
.btn.danger{background:#f8e9e9;color:var(--red)}
.btn.small{padding:7px 9px;border-radius:9px;font-size:12px}
main{max-width:1250px;margin:0 auto;padding:18px 18px 95px}
.nav{display:flex;gap:8px;overflow:auto;margin-bottom:16px;padding-bottom:2px}
.nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:10px 14px;border-radius:999px;font-weight:700;color:var(--muted)}
.nav button.active{background:var(--text);color:white;border-color:var(--text)}
.grid-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.metric{padding:16px}
.metric.clickable{cursor:pointer;position:relative;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease;user-select:none}
.metric.clickable:active{transform:scale(.985)}
.metric.clickable:hover{border-color:#c9c4b9;box-shadow:0 13px 32px rgba(28,34,31,.11)}
.metric .label{color:var(--muted);font-size:12px;margin-bottom:7px}
.metric .value{font-size:24px;font-weight:800;letter-spacing:-.5px}
.metric .sub{font-size:11px;color:var(--muted);margin-top:5px}
.metric-action{font-size:11px;font-weight:800;color:var(--green);margin-top:10px}
.detail-list{display:grid;gap:9px}
.detail-item{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.detail-item:active{transform:scale(.992)}
.detail-head{display:flex;gap:8px;align-items:flex-start}
.detail-head .detail-title{font-weight:800;flex:1;font-size:13px;line-height:1.3}
.detail-amount{font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.detail-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.detail-meta span{font-size:10px;color:var(--muted);background:#f5f3ee;border-radius:999px;padding:4px 7px}
.detail-finance{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.detail-finance div{background:#faf9f6;border-radius:9px;padding:7px}
.detail-finance small{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}
.detail-finance strong{font-size:11px}
.detail-total{position:sticky;bottom:-18px;background:var(--text);color:white;border-radius:13px;padding:12px 14px;margin-top:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.detail-total span{font-size:11px;opacity:.8}
.detail-total strong{font-size:16px}
@media(max-width:650px){.detail-finance{grid-template-columns:1fr 1fr 1fr}.metric-action{margin-top:7px}}
.section{margin-top:16px;padding:18px}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-title h2{font-size:17px;margin:0;flex:1}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:750;background:var(--green2);color:var(--green)}
.badge.gold{background:var(--gold2);color:#7e5b22}
.badge.gray{background:#eee;color:#666}
.lot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lot-card{padding:15px}
.lot-name{font-weight:800;margin-bottom:9px}
.lot-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.lot-row strong{color:var(--text)}
.progress{height:7px;background:#ebe8e1;border-radius:99px;overflow:hidden;margin:12px 0 3px}
.progress > div{height:100%;background:var(--green);border-radius:99px}
.controls{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:650}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:10px 11px;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:#9eb8aa;box-shadow:0 0 0 3px #e7f0eb}
textarea{min-height:78px;resize:vertical}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:970px;background:white}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #ece9e2;font-size:12px;vertical-align:top}
th{position:sticky;top:0;background:#faf9f6;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;z-index:1}
tr:last-child td{border-bottom:0}
.money{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.muted{color:var(--muted)}
.actions{display:flex;gap:5px}
.rate-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rate-card{padding:15px}
.rate-card strong{font-size:21px}
.help{font-size:12px;color:var(--muted);line-height:1.5}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:24px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,20,17,.52);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.dialog{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px}
.dialog-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dialog-head h3{margin:0;flex:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-grid .wide{grid-column:1/-1}
.summary-strip{display:flex;gap:8px;overflow:auto;margin-top:12px}
.pill{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 12px;white-space:nowrap;font-size:12px}
.pill strong{margin-left:5px}
.bottom-nav{display:none}
.notice{background:#fff8e9;border:1px solid #ead7aa;color:#745620;border-radius:13px;padding:11px 13px;font-size:12px;line-height:1.45}
.budget-input{display:flex;gap:6px;margin-top:10px}
.budget-input input{padding:7px 9px;font-size:12px}
.small-note{font-size:10px;color:var(--muted)}
@media(max-width:980px){
  .grid-cards{grid-template-columns:repeat(2,1fr)}
  .lot-grid{grid-template-columns:repeat(2,1fr)}
  .controls{grid-template-columns:1fr 1fr}
  .controls .search{grid-column:1/-1}
}
@media(max-width:650px){
  header .btn.primary{display:none}
  main{padding:12px 12px 90px}
  .nav{display:none}
  .grid-cards{grid-template-columns:1fr 1fr;gap:8px}
  .metric{padding:13px}
  .metric .value{font-size:19px}
  .lot-grid{grid-template-columns:1fr}
  .section{padding:13px}
  .controls{grid-template-columns:1fr}
  .controls .search{grid-column:auto}
  .rate-box{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-grid .wide{grid-column:auto}
  .bottom-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:35;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
  .bottom-nav button{border:0;background:transparent;padding:8px 3px;font-size:10px;color:var(--muted);font-weight:750}
  .bottom-nav button.active{color:var(--green)}
  .bottom-nav .plus{background:var(--green);color:white;border-radius:13px;margin:0 4px}
  .dialog{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
}

.robot-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}
.robot-panel{padding:18px}
.robot-mic{width:92px;height:92px;border-radius:50%;border:0;background:var(--green);color:white;font-size:34px;box-shadow:0 10px 25px rgba(31,107,79,.25);transition:.2s}
.robot-mic.listening{transform:scale(1.04);background:#a13f3f;box-shadow:0 0 0 9px rgba(161,63,63,.12)}
.robot-status{font-weight:800;margin-top:10px}
.robot-transcript{min-height:120px;font-size:15px;line-height:1.5}
.robot-example{padding:10px 12px;border:1px dashed #d9d3c7;border-radius:12px;background:#faf8f3;font-size:12px;color:var(--muted);margin-top:8px}
.robot-preview{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.robot-preview .preview-item{background:#faf9f6;border:1px solid var(--line);border-radius:12px;padding:10px}
.preview-item span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:3px}
.preview-item strong{font-size:13px}
.robot-confidence{height:7px;background:#ebe8e1;border-radius:99px;overflow:hidden;margin-top:7px}
.robot-confidence div{height:100%;background:var(--green)}
.robot-tips{display:grid;gap:8px}
.robot-tip{border:1px solid var(--line);border-radius:12px;padding:11px;background:white;font-size:12px;line-height:1.45}
@media(max-width:760px){
  .robot-hero{grid-template-columns:1fr}
  .robot-preview{grid-template-columns:1fr 1fr}
  .bottom-nav{grid-template-columns:repeat(6,1fr)!important}
}
@media(max-width:430px){
  .robot-preview{grid-template-columns:1fr}
}


.invoice-drop{border:2px dashed #cfc8bb;border-radius:18px;padding:24px;text-align:center;background:#faf8f3;transition:.2s}
.invoice-drop.drag{border-color:var(--green);background:#eef6f1}
.invoice-drop input{display:none}
.invoice-file{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:white;margin-top:10px;text-align:left}
.invoice-file .icon{font-size:24px}
.invoice-file .meta{flex:1;min-width:0}
.invoice-file .name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invoice-file .size{font-size:11px;color:var(--muted)}
.ai-working{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#edf4f0;margin-top:12px}
.spinner{width:18px;height:18px;border:3px solid #cbdad2;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ai-result-grid .preview-item{background:#faf9f6;border:1px solid var(--line);border-radius:12px;padding:10px}
.ai-raw{margin-top:10px}
.ai-raw summary{cursor:pointer;font-weight:750;font-size:12px;color:var(--muted)}
.ai-raw pre{white-space:pre-wrap;word-break:break-word;background:#111814;color:#e9f0ec;padding:12px;border-radius:12px;max-height:260px;overflow:auto;font-size:11px}
.attach-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;background:white;font-size:10px;font-weight:750}
@media(max-width:760px){.ai-result-grid{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.ai-result-grid{grid-template-columns:1fr}}


.lang-switch{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lang-switch button{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800}
.lang-switch button.active{background:var(--text);color:white;border-color:var(--text)}
.rtl-text{direction:rtl;text-align:right}


html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
body{padding-top:env(safe-area-inset-top)}
header{padding-top:env(safe-area-inset-top)}
button,.btn{touch-action:manipulation}
@supports (-webkit-touch-callout:none){
  input,select,textarea{font-size:16px}
}

</style>

</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <h1>🏠 Suivi coût de ma maison</h1>
      <p>Tous les lots du chantier • Matériel • Main-d’œuvre • Devis • Paiements</p>
    </div>
    <button class="btn primary" onclick="openExpenseModal()">＋ Ajouter une dépense</button>
  </div>
</header>

<main>
  <div class="nav">
    <button data-tab="dashboard" class="active" onclick="showTab('dashboard')">Dashboard</button>
    <button data-tab="expenses" onclick="showTab('expenses')">Dépenses</button>
    <button data-tab="lots" onclick="showTab('lots')">Lots</button>
    <button data-tab="robot" onclick="showTab('robot')">🤖 Robot chantier</button>
    <button data-tab="invoice" onclick="showTab('invoice')">📄 Facture AI</button>
    <button data-tab="settings" onclick="showTab('settings')">Taux & sauvegarde</button>
  </div>

  <section id="tab-dashboard"></section>
  <section id="tab-expenses" style="display:none"></section>
  <section id="tab-lots" style="display:none"></section>
  <section id="tab-robot" style="display:none"></section>
  <section id="tab-invoice" style="display:none"></section>
  <section id="tab-settings" style="display:none"></section>
</main>

<div class="bottom-nav">
  <button data-btab="dashboard" class="active" onclick="showTab('dashboard')">🏠<br>Accueil</button>
  <button data-btab="expenses" onclick="showTab('expenses')">🧾<br>Dépenses</button>
  <button data-btab="robot" class="plus" onclick="showTab('robot')">🎙️<br>Robot</button>
  <button data-btab="invoice" onclick="showTab('invoice')">📄<br>Facture</button>
  <button data-btab="lots" onclick="showTab('lots')">📦<br>Lots</button>
  <button data-btab="settings" onclick="showTab('settings')">⚙️<br>Réglages</button>
</div>

<div id="metricDetailModal" class="modal" onclick="if(event.target===this) closeMetricDetails()">
  <div class="dialog">
    <div class="dialog-head">
      <h3 id="metricDetailTitle">Détail</h3>
      <button class="btn small" onclick="closeMetricDetails()">Fermer</button>
    </div>
    <div id="metricDetailBody"></div>
  </div>
</div>

<div id="expenseModal" class="modal" onclick="if(event.target===this) closeExpenseModal()">
  <div class="dialog">
    <div class="dialog-head">
      <h3 id="modalTitle">Ajouter une dépense</h3>
      <button class="btn small" onclick="closeExpenseModal()">Fermer</button>
    </div>
    <form id="expenseForm" onsubmit="saveExpense(event)">
      <input type="hidden" id="f-id">
      <input type="hidden" id="f-attachmentid">
      <input type="hidden" id="f-attachmentname">
      <div class="form-grid">
        <div class="field">
          <label>Lot</label>
          <select id="f-lot" required></select>
        </div>
        <div class="field">
          <label>Catégorie</label>
          <select id="f-type">
            <option>Matériel</option>
            <option>Main-d’œuvre</option>
            <option>Mixte / à ventiler</option>
          </select>
        </div>
        <div class="field">
          <label>Fournisseur / artisan</label>
          <input id="f-supplier" placeholder="Ex. SFMC">
        </div>
        <div class="field">
          <label>Statut</label>
          <select id="f-status">
            <option>Payé</option>
            <option>Avance</option>
            <option>Devis / non confirmé</option>
          </select>
        </div>
        <div class="field wide">
          <label>Description</label>
          <input id="f-description" required placeholder="Ex. Carrelage salle de bain">
        </div>
        <div class="field">
          <label>Montant total du devis / marché (optionnel)</label>
          <input id="f-contract" type="number" step="0.001" min="0" placeholder="Laisser vide si inconnu">
        </div>
        <div class="field">
          <label>Montant déjà payé</label>
          <input id="f-paid" type="number" step="0.001" min="0" value="0" required>
        </div>
        <div class="field">
          <label>Devise</label>
          <select id="f-currency" onchange="toggleRateFields()">
            <option>TND</option><option>USD</option><option>QAR</option><option>EUR</option>
          </select>
        </div>
        <div class="field">
          <label>Date</label>
          <input id="f-date" type="date">
        </div>
        <div class="field" id="customRateWrap">
          <label>Taux TND personnalisé (optionnel)</label>
          <input id="f-customrate" type="number" step="0.000001" min="0" placeholder="Sinon taux global">
        </div>
        <div class="field" id="usdEqWrap">
          <label>Équivalent USD de référence (optionnel)</label>
          <input id="f-usdeq" type="number" step="0.01" min="0" placeholder="Utile pour QAR">
        </div>
        <div class="field wide">
          <label>Notes</label>
          <textarea id="f-notes" placeholder="Facture, référence, détails..."></textarea>
        </div>
        <div class="field wide" id="f-attachment-wrap" style="display:none">
          <label>Pièce jointe</label>
          <div class="invoice-file">
            <div class="icon">📎</div>
            <div class="meta">
              <div class="name" id="f-attachment-label"></div>
              <div class="size">La facture sera liée à cette dépense.</div>
            </div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button type="button" class="btn" onclick="closeExpenseModal()">Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

function clone(o){return JSON.parse(JSON.stringify(o))}

function fmt(n, digits=2){
  if(n===null || n===undefined || Number.isNaN(Number(n))) return '—';
  return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(Number(n));
}
function money(n,c='TND',digits){
  const d = digits===undefined ? (c==='TND' ? 3 : 2) : digits;
  return `${fmt(n,d)} ${c}`;
}
function rateFor(e){
  if(e.currency==='TND') return 1;
  if(e.customRate) return Number(e.customRate);
  if(e.currency==='USD') return Number(state.settings.usdRate)||0;
  if(e.currency==='QAR') {
    if(e.usdEquivalent && e.paidAmount>0) return (Number(e.usdEquivalent)*Number(state.settings.usdRate||0))/Number(e.paidAmount);
    return Number(state.settings.qarRate)||0;
  }
  if(e.currency==='EUR') return Number(state.settings.eurRate)||0;
  return 0;
}
function amountToTnd(amount,e){
  const r = rateFor(e);
  return r>0 ? Number(amount||0)*r : null;
}
function paidTnd(e){ return amountToTnd(e.paidAmount,e); }
function contractTnd(e){ return e.contractAmount===null || e.contractAmount==='' || e.contractAmount===undefined ? null : amountToTnd(e.contractAmount,e); }
function remainingNative(e){
  if(e.status==='Devis / non confirmé') return null;
  if(e.contractAmount===null || e.contractAmount==='' || e.contractAmount===undefined) return null;
  return Math.max(0,Number(e.contractAmount)-Number(e.paidAmount||0));
}
function remainingTnd(e){
  const r=remainingNative(e); return r===null?null:amountToTnd(r,e);
}
function sum(arr){return arr.reduce((a,b)=>a+(Number(b)||0),0)}
function paidExpenses(){return state.expenses.filter(e=>Number(e.paidAmount)>0)}
function totals(){
  const paid = sum(paidExpenses().map(e=>paidTnd(e)||0));
  const remaining = sum(state.expenses.map(e=>remainingTnd(e)||0));
  const material = sum(paidExpenses().filter(e=>e.type==='Matériel').map(e=>paidTnd(e)||0));
  const labor = sum(paidExpenses().filter(e=>e.type==='Main-d’œuvre').map(e=>paidTnd(e)||0));
  const mixed = sum(paidExpenses().filter(e=>e.type==='Mixte / à ventiler').map(e=>paidTnd(e)||0));
  const quotes = sum(state.expenses.filter(e=>e.status==='Devis / non confirmé').map(e=>contractTnd(e)||0));
  return {paid,remaining,material,labor,mixed,quotes};
}
function nativeCurrencyTotals(){
  const obj={};
  paidExpenses().forEach(e=>obj[e.currency]=(obj[e.currency]||0)+Number(e.paidAmount||0));
  return obj;
}
function lotStats(lot){
  const ex=state.expenses.filter(e=>e.lot===lot);
  const paid=sum(ex.map(e=>paidTnd(e)||0));
  const material=sum(ex.filter(e=>e.type==='Matériel').map(e=>paidTnd(e)||0));
  const labor=sum(ex.filter(e=>e.type==='Main-d’œuvre').map(e=>paidTnd(e)||0));
  const mixed=sum(ex.filter(e=>e.type==='Mixte / à ventiler').map(e=>paidTnd(e)||0));
  const remaining=sum(ex.map(e=>remainingTnd(e)||0));
  const budget=Number(state.lotBudgets[lot]||0);
  return {ex,paid,material,labor,mixed,remaining,budget};
}
function allLots(){

}

function metricDetailConfig(kind){
  const configs={
    paid:{title:'Total payé — détail des sources',filter:e=>Number(e.paidAmount)>0,value:e=>paidTnd(e)||0,native:e=>Number(e.paidAmount||0),label:'Payé'},
    remaining:{title:'Reste connu à payer — détail exact',filter:e=>(remainingNative(e)||0)>0,value:e=>remainingTnd(e)||0,native:e=>remainingNative(e)||0,label:'Reste'},
    material:{title:'Matériel payé — détail des achats',filter:e=>e.type==='Matériel'&&Number(e.paidAmount)>0,value:e=>paidTnd(e)||0,native:e=>Number(e.paidAmount||0),label:'Payé'},
    labor:{title:'Main-d’œuvre payée — détail des paiements',filter:e=>e.type==='Main-d’œuvre'&&Number(e.paidAmount)>0,value:e=>paidTnd(e)||0,native:e=>Number(e.paidAmount||0),label:'Payé'},
    quotes:{title:'Devis non confirmés — détail',filter:e=>e.status==='Devis / non confirmé'&&(contractTnd(e)||0)>0,value:e=>contractTnd(e)||0,native:e=>Number(e.contractAmount||0),label:'Devis'}
  };
  return configs[kind]||configs.paid;
}
function openMetricDetails(kind){
  const cfg=metricDetailConfig(kind);
  const arr=state.expenses.filter(cfg.filter).sort((a,b)=>cfg.value(b)-cfg.value(a));
  const total=sum(arr.map(cfg.value));
  document.getElementById('metricDetailTitle').textContent=cfg.title;
  const body=document.getElementById('metricDetailBody');
  if(!arr.length){
    body.innerHTML='<div class="empty">Aucun poste dans cette catégorie.</div>';
  }else{
    body.innerHTML=`<div class="detail-list">${arr.map(e=>metricDetailItem(e,kind,cfg)).join('')}</div>
      <div class="detail-total"><span>${arr.length} poste${arr.length>1?'s':''}</span><strong>${money(total,'TND',2)}</strong></div>`;
  }
  document.getElementById('metricDetailModal').classList.add('open');
}

function toggleRobotMic(){
  if(robotListening){ stopRobotMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    const s=document.getElementById('robotStatus');
    if(s) s.textContent='Micro non pris en charge : utilise la zone de texte.';
    return;
  }
  robotRecognition = new SR();
  robotRecognition.lang=assistantLangConfig().speech;
  robotRecognition.continuous=true;
  robotRecognition.interimResults=true;
  let finalText=document.getElementById('robotTranscript')?.value?.trim()||'';
  robotRecognition.onstart=()=>{
    robotListening=true;
    const b=document.getElementById('robotMic'); if(b)b.classList.add('listening');
    const s=document.getElementById('robotStatus'); if(s)s.textContent='Je t’écoute… appuie à nouveau pour arrêter';
  };
  robotRecognition.onresult=(ev)=>{
    let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const tx=ev.results[i][0].transcript;
      if(ev.results[i].isFinal) finalText += (finalText?' ':'') + tx.trim();
      else interim += tx;
    }
    const ta=document.getElementById('robotTranscript');
    if(ta) ta.value=(finalText+(interim?' '+interim:'')).trim();
  };
  robotRecognition.onerror=(ev)=>{
    const s=document.getElementById('robotStatus');
    if(s)s.textContent=ev.error==='not-allowed'?'Autorise le microphone dans le navigateur.':'Erreur micro : '+ev.error;
  };
  robotRecognition.onend=()=>{
    robotListening=false;
    const b=document.getElementById('robotMic'); if(b)b.classList.remove('listening');
    const s=document.getElementById('robotStatus'); if(s)s.textContent='Micro arrêté — tu peux analyser le texte';
  };
  try{robotRecognition.start()}catch(e){}
}
function stopRobotMic(){
  try{if(robotRecognition)robotRecognition.stop()}catch(e){}
}
function clearRobot(){

  robotLastProposal=null;

  const p=document.getElementById('robotProposal');if(p)p.innerHTML='';
}

function arabicDigitsToLatin(s){
  const map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
             '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  return String(s||'').replace(/[٠-٩۰-۹]/g,ch=>map[ch]||ch);
}

function normalizeRobotText(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’']/g," ").replace(/\s+/g,' ').trim();
}
function parseNumericToken(raw){
  if(!raw)return null;
  const s=String(raw).replace(/\s/g,'').replace(/,/g,'.');
  const n=Number(s); return Number.isFinite(n)?n:null;
}
function frenchNumberWords(text){
  const t=normalizeRobotText(text).replace(/-/g,' ');
  const units={zero:0,un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16};
  const tens={vingt:20,trente:30,quarante:40,cinquante:50,soixante:60};
  const words=t.split(/\s+/);
  let total=0,current=0,seen=false;
  for(const w of words){
    if(w in units){current+=units[w];seen=true;continue}
    if(w in tens){current+=tens[w];seen=true;continue}
    if(w==='cent'||w==='cents'){current=(current||1)*100;seen=true;continue}
    if(w==='mille'||w==='milles'){total+=(current||1)*1000;current=0;seen=true;continue}
    if(w==='million'||w==='millions'){total+=(current||1)*1000000;current=0;seen=true;continue}
    if(w==='et')continue;
    if(seen)break;
  }
  return seen?total+current:null;
}
function extractAmountAround(text, keywords){
  const n=normalizeRobotText(text);
  for(const kw of keywords){
    const pos=n.indexOf(kw);
    if(pos>=0){
      const chunk=n.slice(pos, pos+85);
      let m=chunk.match(/(\d[\d\s]*(?:[.,]\d{1,3})?)/);
      if(m)return parseNumericToken(m[1]);
      const words=frenchNumberWords(chunk.slice(kw.length));
      if(words)return words;
    }
  }
  return null;
}

  if(/\b(qar|riyal|riyals|qatar)\b|ريال|ريالات|قطر/.test(n))return 'QAR';

  if(/\b(tnd|dt|dinar|dinars)\b|دينار|دنانير|تونسي/.test(n))return 'TND';

}

function detectType(n,lot){
  if(/main d oeuvre|main oeuvre|labor|labour|workmanship|artisan|pose seule|salaire|يد عاملة|اجرة|أجرة|مصنعية|تركيب فقط/.test(n))return 'Main-d’œuvre';
  if(/materiel|matiere|material|materials|purchase|bought|equipment|fourniture|equipement|appareil|commande|مواد|معدات|شراء|اشتريت|مستلزمات/.test(n))return 'Matériel';
  if(/ahmed ben hmad/.test(n))return 'Main-d’œuvre';
  if(/sfmc|empolo|speed air|arabesque|alibaba|kuwfi/.test(n))return 'Matériel';
  return 'Matériel';
}
function detectSupplier(n, original){
  const known=[...new Set(state.expenses.map(e=>e.supplier).filter(Boolean))].sort((a,b)=>b.length-a.length);
  const nn=normalizeRobotText(original);
  for(const s of known){
    if(s && nn.includes(normalizeRobotText(s)))return s;
  }
  const aliases=[
    [/ahmed ben hmad/,'Ahmed Ben Hmad'],[/sfmc/,'SFMC'],[/speed air/,'SPEED AIR'],
    [/empolo/,'Foshan EMPOLO'],[/arabesque/,'Arabesque'],[/plombier/,'Plombier'],
    [/electricien/,'Électricien'],[/aluminium/,'Fournisseur aluminium']
  ];
  for(const [re,name] of aliases)if(re.test(n))return name;
  // Try "chez X" or "à X" until a separator word.
  const m=original.match(/(?:chez|à|au|a)\s+([A-Za-zÀ-ÿ0-9 .&'-]{2,45}?)(?=\s+(?:pour|comme|de|du|des|le|la|les|montant|avance)\b|[,.]|$)/i);
  return m?m[1].trim():'';
}
function detectDate(n){
  const d=new Date();
  if(/\baujourd hui\b/.test(n))return d.toISOString().slice(0,10);
  if(/\bhier\b/.test(n)){d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
  const m=n.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/);
  if(m){
    let y=Number(m[3]);if(y<100)y+=2000;
    return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  }
  return '';
}
function analyzeRobotText(){
  const original=document.getElementById('robotTranscript')?.value?.trim()||'';
  if(!original){alert('Dicte ou écris d’abord une dépense.');return}
  const n=normalizeRobotText(original);
  const currency=detectCurrency(n);
  const status=/\b(devis|quotation|quote|offer|proforma|estimate)\b|عرض سعر|فاتورة مبدئية/.test(n)
    && !/\b(paye|payee|paid|payment|verse|donne|avance|acompte|deposit|bought|achete)\b|دفعت|مدفوع|عربون|تسبقة|مقدم|اشتريت/.test(n)
    ?'Devis / non confirmé'
    :(/\b(avance|acompte|deposit|down payment)\b|عربون|تسبقة|مقدم/.test(n)?'Avance':'Payé');

  let contract=extractAmountAround(n,['devis','quotation','quote','estimate','marche','total','cout total','montant total','عرض سعر','الإجمالي','الاجمالي','المجموع']);
  let paid=extractAmountAround(n,['avance','acompte','deposit','down payment','paid','payment','i paid','i bought','j ai paye','paye','j ai donne','donne','verse','j ai achete','achete','دفعت','دفع','عربون','تسبقة','اشتريت']);
  if(paid===null){
    let m=n.match(/(\d[\d\s]*(?:[.,]\d{1,3})?)/);
    if(m)paid=parseNumericToken(m[1]);
    else paid=frenchNumberWords(n);
  }
  if(status==='Devis / non confirmé'){
    if(contract===null)contract=paid;
    paid=0;
  }
  if(status==='Avance' && contract!==null && paid===null){
    // If only one amount followed "devis", avoid treating total as the advance.
    paid=0;
  }
  const lot=detectLot(n);
  const type=detectType(n,lot);
  const supplier=detectSupplier(n,original);

  let confidence=35;
  if(paid!==null&&paid>0)confidence+=25;
  if(lot!=='Autres')confidence+=20;
  if(supplier)confidence+=10;
  if(/\b(tnd|dinar|dinars|usd|dollar|qar|riyal|euro)\b/.test(n))confidence+=5;
  if(/\b(main d oeuvre|materiel|avance|acompte|devis)\b/.test(n))confidence+=5;
  confidence=Math.min(100,confidence);

  robotLastProposal={
    lot,type,supplier,
    description:original,
    currency,
    contractAmount:contract,
    paidAmount:paid??0,
    status,
    date:detectDate(n),
    notes:'Saisie préparée par Robot Chantier à partir du vocal : '+original,
    confidence
  };
  renderRobotProposal(robotLastProposal);
}
function renderRobotProposal(p){
  const el=document.getElementById('robotProposal');if(!el)return;
  const remain=p.contractAmount!==null&&p.contractAmount!==undefined?Math.max(0,Number(p.contractAmount)-Number(p.paidAmount||0)):null;
  el.innerHTML=`
    <div class="card" style="padding:14px;margin-top:14px">
      <div class="section-title"><h2>Proposition du robot</h2><span class="badge">${p.confidence}% confiance</span></div>
      <div class="robot-confidence"><div style="width:${p.confidence}%"></div></div>

        ${remain!==null?`<div class="preview-item"><span>Reste estimé</span><strong>${money(remain,p.currency)}</strong></div>`:''}
        <div class="preview-item"><span>Devise</span><strong>${esc(p.currency)}</strong></div>
      </div>
      <div class="notice" style="margin-top:10px">Vérifie la proposition avant de l’enregistrer. Le bouton ci-dessous ouvre la fiche normale avec les champs déjà remplis.</div>
      <div class="toolbar" style="margin-top:10px">

        <button class="btn" onclick="analyzeRobotText()">↻ Réanalyser</button>
      </div>
    </div>`;
}

// ---------- Pièces jointes : stockage local IndexedDB ----------
function openInvoiceDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('MaisonCostFiles',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'})};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveAttachment(file){
  const id='att-'+Date.now()+'-'+Math.random().toString(36).slice(2);
  const db=await openInvoiceDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readwrite');
    tx.objectStore('files').put({id,name:file.name,type:file.type,size:file.size,blob:file,createdAt:new Date().toISOString()});
    tx.oncomplete=()=>resolve(id);
    tx.onerror=()=>reject(tx.error);
  });
}
async function getAttachment(id){
  const db=await openInvoiceDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readonly');
    const r=tx.objectStore('files').get(id);
    r.onsuccess=()=>resolve(r.result||null);
    r.onerror=()=>reject(r.error);
  });
}
async function openAttachment(id){
  const rec=await getAttachment(id);
  if(!rec){alert('Pièce jointe introuvable sur cet appareil.');return}
  const u=URL.createObjectURL(rec.blob);
  window.open(u,'_blank');
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}

function invoiceDrag(ev,on){

}
function invoiceDropFile(ev){

function humanFileSize(bytes){
  if(bytes<1024)return bytes+' o';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' Ko';
  return (bytes/1024/1024).toFixed(1)+' Mo';
}
async function handleInvoiceFile(file){
  if(!file)return;
  const ok=file.type==='application/pdf'||/^image\/(jpeg|png|webp)$/.test(file.type);
  if(!ok){alert('Format non pris en charge. Utilise PDF, JPG, PNG ou WEBP.');return}
  invoiceCurrentFile=file;
  invoiceExtractedText='';
  invoiceLastProposal=null;
  document.getElementById('invoiceSelected').innerHTML=`
    <div class="invoice-file">
      <div class="icon">${file.type==='application/pdf'?'📄':'🖼️'}</div>
      <div class="meta"><div class="name">${esc(file.name)}</div><div class="size">${humanFileSize(file.size)}</div></div>
      <button class="btn small" onclick="clearInvoiceAI()">Changer</button>
    </div>`;
  document.getElementById('invoiceResult').innerHTML='';
  await analyzeInvoiceFile();
}
function clearInvoiceAI(){
  invoiceCurrentFile=null; invoiceExtractedText=''; invoiceLastProposal=null;
  renderInvoiceAI();
}
function setInvoiceWorking(text){
  const el=document.getElementById('invoiceWorking');if(!el)return;
  el.innerHTML=text?`<div class="ai-working"><div class="spinner"></div><div><strong>${esc(text)}</strong><div class="small-note">Ne ferme pas cette page pendant l'analyse.</div></div></div>`:'';
}
async function analyzeInvoiceFile(){
  if(!invoiceCurrentFile)return;
  try{
    let text='';
    if(invoiceCurrentFile.type==='application/pdf'){
      setInvoiceWorking('Lecture du PDF…');
      text=await extractPdfText(invoiceCurrentFile);
      if(text.replace(/\s/g,'').length<80){
        setInvoiceWorking('PDF scanné détecté — reconnaissance de la première page…');
        text += '\n'+await ocrPdfFirstPage(invoiceCurrentFile);
      }
    }else{
      setInvoiceWorking('Reconnaissance du texte de l’image…');
      text=await ocrImageFile(invoiceCurrentFile);
    }
    invoiceExtractedText=text||'';
    setInvoiceWorking('Analyse des informations de la facture…');
    await new Promise(r=>setTimeout(r,120));
    invoiceLastProposal=analyzeInvoiceExtractedText(invoiceExtractedText, invoiceCurrentFile.name);
    setInvoiceWorking('');
    renderInvoiceResult(invoiceLastProposal);
  }catch(err){
    console.error(err);
    setInvoiceWorking('');
    document.getElementById('invoiceResult').innerHTML=`<div class="notice" style="margin-top:12px">L'analyse automatique n'a pas pu être terminée : ${esc(err.message||String(err))}. Tu peux toujours utiliser la saisie classique ou réessayer avec une image plus nette.</div>`;
  }
}
async function extractPdfText(file){
  if(!window.pdfjsLib)throw new Error('Le moteur PDF n’a pas pu être chargé. Vérifie la connexion Internet.');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let parts=[];
  const maxPages=Math.min(pdf.numPages,12);
  for(let p=1;p<=maxPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    parts.push(content.items.map(i=>i.str).join(' '));
  }
  return parts.join('\n');
}
async function ocrPdfFirstPage(file){
  if(!window.pdfjsLib)throw new Error('Moteur PDF indisponible.');
  if(!window.Tesseract)throw new Error('Moteur de reconnaissance d’image indisponible.');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const viewport=page.getViewport({scale:1.7});
  const canvas=document.createElement('canvas');
  canvas.width=viewport.width;canvas.height=viewport.height;
  await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
  const result=await Tesseract.recognize(canvas,assistantLangConfig().ocr,{logger:m=>{
    if(m.status==='recognizing text')setInvoiceWorking(`Lecture de l'image… ${Math.round((m.progress||0)*100)} %`);
  }});
  return result.data.text||'';
}
async function ocrImageFile(file){
  if(!window.Tesseract)throw new Error('Le moteur de reconnaissance d’image n’a pas pu être chargé. Vérifie la connexion Internet.');
  const result=await Tesseract.recognize(file,assistantLangConfig().ocr,{logger:m=>{
    if(m.status==='recognizing text')setInvoiceWorking(`Lecture de l'image… ${Math.round((m.progress||0)*100)} %`);
  }});
  return result.data.text||'';
}
function invoiceCurrency(text){
  const n=normalizeRobotText(text);
  if(/\bqar\b|qatar riyal|riyal|ريال|ريالات|قطر/.test(n))return 'QAR';
  if(/\busd\b|\bdollar|دولار|دولارات/.test(n)||/\$\s*\d/.test(text))return 'USD';
  if(/\beur\b|\beuro|يورو/.test(n)||/€/.test(text))return 'EUR';
  if(/\btnd\b|\bdt\b|\bdinar|دينار|دنانير|تونسي/.test(n))return 'TND';
  return 'TND';
}
function cleanMoneyNumber(s){
  if(!s)return null;
  let x=String(s).trim().replace(/\u00a0/g,' ').replace(/\s/g,'');
  // Handle common European/Tunisian formats.
  if(x.includes(',')&&x.includes('.')){
    if(x.lastIndexOf(',')>x.lastIndexOf('.')) x=x.replace(/\./g,'').replace(',','.');
    else x=x.replace(/,/g,'');
  }else if(x.includes(',')){
    const pieces=x.split(',');
    if(pieces[pieces.length-1].length<=3)x=pieces.slice(0,-1).join('')+'.'+pieces[pieces.length-1];
    else x=x.replace(/,/g,'');
  }else{
    const dots=(x.match(/\./g)||[]).length;
    if(dots>1){
      const ps=x.split('.');x=ps.slice(0,-1).join('')+'.'+ps[ps.length-1];
    }
  }
  x=x.replace(/[^\d.-]/g,'');
  const n=Number(x);return Number.isFinite(n)?n:null;
}
function findInvoiceAmount(text){
  const lines=String(text).split(/\n| {2,}/).map(x=>x.trim()).filter(Boolean);
  const priorities=[
    /amount paid/i,/paid amount/i,/net\s*(a|à)\s*payer/i,/net to pay/i,/total\s*t\.?t\.?c/i,/total ttc/i,
    /grand total/i,/order total/i,/invoice total/i,/total amount/i,/montant total/i,
    /المبلغ المدفوع/i,/صافي للدفع/i,/الإجمالي/i,/الاجمالي/i,/المجموع/i,/المبلغ الإجمالي/i,/المبلغ الاجمالي/i,
    /total/i
  ];
  for(const re of priorities){
    for(const line of lines){
      if(re.test(line)){
        const nums=[...line.matchAll(/(?:USD|TND|QAR|EUR|\$|€|DT)?\s*([0-9][0-9\s.,]{0,20})/gi)]
          .map(m=>cleanMoneyNumber(m[1])).filter(x=>x!==null&&x>0);
        if(nums.length)return nums[nums.length-1];
      }
    }
  }
  // Search across line breaks after keyword
  for(const re of priorities){
    const m=text.match(new RegExp(re.source+'[\\s:\\-]*?(?:USD|TND|QAR|EUR|\\$|€)?\\s*([0-9][0-9\\s.,]{0,20})','i'));
    if(m){const v=cleanMoneyNumber(m[1]);if(v)return v}
  }
  return null;
}
function findInvoiceNumber(text){
  const patterns=[
    /(?:invoice|facture|devis|proforma|pi|order|فاتورة|عرض سعر|طلب)\s*(?:no|n°|number|num[eé]ro|رقم|#|\.?\s*no)?\s*[:#.-]?\s*([A-Z0-9٠-٩۰-۹][A-Z0-9٠-٩۰-۹\-\/]{3,})/i,
    /\b(?:DEV|PI|INV)[-\/]?[A-Z0-9\-\/]{3,}\b/i
  ];
  for(const re of patterns){
    const m=text.match(re);if(m)return (m[1]||m[0]).trim();
  }
  return '';
}
function findInvoiceDate(text){
  const patterns=[
    /\b(20\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})\b/,
    /\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\b/,
    /\b(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(20\d{2})\b/i
  ];
  let m=text.match(patterns[0]); if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=text.match(patterns[1]); if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  m=text.match(patterns[2]);
  if(m){
    const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    const mo=months[m[1].slice(0,3).toLowerCase()];
    return `${m[3]}-${String(mo).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  }
  return '';
}
function findSupplierFromInvoice(text,filename){
  const lines=String(text).split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,18);
  const reject=/^(invoice|facture|devis|proforma|receipt|recu|reçu|date|client|customer|to:|bill to|ship to|address|tel|phone|email)/i;
  for(const line of lines){
    if(line.length>=4&&line.length<=90&&!reject.test(line)&&/[A-Za-zÀ-ÿ]{3}/.test(line)){
      if(/(?:company|co\.?|ltd|sarl|sa\b|service|technology|materials|security|air|empolo|sfmc)/i.test(line))return line.replace(/\s{2,}.*/,'').trim();
    }
  }
  return filename.replace(/\.(pdf|png|jpe?g|webp)$/i,'').slice(0,70);
}
function invoiceStatus(text){
  const n=normalizeRobotText(text);
  if(/\b(amount paid|paid on|payment information|receipt|recu|reçu|paye|payee|paid)\b|مدفوع|تم الدفع|وصل|إيصال|ايصال/.test(n))return 'Payé';
  if(/\b(proforma|devis|quotation|quote|offer|estimate|offre de prix)\b|عرض سعر|فاتورة مبدئية/.test(n))return 'Devis / non confirmé';
  return 'Devis / non confirmé';
}
function analyzeInvoiceExtractedText(text,filename){
  const n=normalizeRobotText(text);
  const currency=invoiceCurrency(text);
  const amount=findInvoiceAmount(text);
  const status=invoiceStatus(text);
  const invNo=findInvoiceNumber(text);
  const date=findInvoiceDate(text);
  const supplier=findSupplierFromInvoice(text,filename);
  const lot=detectLot(n);
  const type=detectType(n,lot);
  let confidence=25;
  if(amount)confidence+=25;
  if(supplier)confidence+=15;
  if(invNo)confidence+=10;
  if(date)confidence+=10;
  if(lot!=='Autres')confidence+=10;
  if(currency)confidence+=5;
  confidence=Math.min(100,confidence);
  return {
    supplier,invoiceNo:invNo,date,currency,amount:amount||0,lot,type,status,confidence,
    description: invNo?`Facture / devis ${invNo}`:`Facture ${supplier||filename}`,
    notes:`Analyse automatique de la pièce jointe ${filename}. ${invNo?'Référence détectée : '+invNo+'. ':''}Vérifier les données avant validation.`
  };
}

function waitForGoogleIdentity(timeout=10000){
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    const check=()=>{
      if(window.google?.accounts?.oauth2) return resolve();
      if(Date.now()-started>timeout) return reject(new Error('Google Identity Services indisponible. Vérifie la connexion Internet.'));
      setTimeout(check,150);
    };
    check();
  });
}
async function initDriveTokenClient(){
  if(driveTokenClient) return driveTokenClient;
  await waitForGoogleIdentity();
  driveTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_DRIVE_CLIENT_ID,
    scope:GOOGLE_DRIVE_SCOPE,
    callback:()=>{}
  });
  return driveTokenClient;
}
function requestDriveToken(prompt=''){
  return new Promise(async(resolve,reject)=>{
    try{
      const tc=await initDriveTokenClient();
      tc.callback=(resp)=>{
        if(resp?.error) return reject(new Error(resp.error_description||resp.error));
        driveAccessToken=resp.access_token;
        updateDriveStatus();
        resolve(driveAccessToken);
      };
      tc.requestAccessToken({prompt});
    }catch(e){reject(e)}
  });
}
async function ensureDriveToken(interactive=true){
  if(driveAccessToken) return driveAccessToken;
  return requestDriveToken(interactive?'consent':'');
}
async function driveRequest(url,opts={}){
  await ensureDriveToken(true);
  const headers=new Headers(opts.headers||{});
  headers.set('Authorization','Bearer '+driveAccessToken);
  const res=await fetch(url,{...opts,headers});
  if(res.status===401){
    driveAccessToken=null;
    await ensureDriveToken(true);
    headers.set('Authorization','Bearer '+driveAccessToken);
    const retry=await fetch(url,{...opts,headers});
    if(!retry.ok) throw new Error(await retry.text()||('Erreur Drive '+retry.status));
    return retry;
  }
  if(!res.ok) throw new Error(await res.text()||('Erreur Drive '+res.status));
  return res;
}
function qDrive(s){return encodeURIComponent(s)}
async function driveFindFiles(q,pageSize=100){
  const url=`https://www.googleapis.com/drive/v3/files?q=${qDrive(q)}&spaces=drive&pageSize=${pageSize}&orderBy=modifiedTime%20desc&fields=files(id,name,mimeType,modifiedTime,parents,size)`;
  const r=await driveRequest(url);
  return (await r.json()).files||[];
}
async function driveCreateFolder(name,parentId=null){
  const meta={name,mimeType:'application/vnd.google-apps.folder'};
  if(parentId) meta.parents=[parentId];
  const r=await driveRequest('https://www.googleapis.com/drive/v3/files?fields=id,name,modifiedTime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)});
  return r.json();
}
async function driveEnsureFolder(name,parentId=null){
  let q=`name='${name.replaceAll("'","\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  if(parentId) q+=` and '${parentId}' in parents`;
  const found=await driveFindFiles(q,10);
  return found[0]||await driveCreateFolder(name,parentId);
}
async function driveFindFileByName(name,parentId){
  const q=`name='${name.replaceAll("'","\\'")}' and '${parentId}' in parents and trashed=false`;
  const f=await driveFindFiles(q,10);
  return f[0]||null;
}
async function driveCreateEmptyFile(name,mimeType,parentId){
  const meta={name,mimeType,parents:[parentId]};
  const r=await driveRequest('https://www.googleapis.com/drive/v3/files?fields=id,name,modifiedTime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(meta)});
  return r.json();
}
async function driveUploadMedia(fileId,body,mimeType){
  const r=await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=id,name,modifiedTime,size`,{method:'PATCH',headers:{'Content-Type':mimeType||'application/octet-stream'},body});
  return r.json();
}
async function driveUpsertFile(name,parentId,body,mimeType){
  let f=await driveFindFileByName(name,parentId);
  if(!f) f=await driveCreateEmptyFile(name,mimeType,parentId);
  return driveUploadMedia(f.id,body,mimeType);
}
async function listLocalAttachments(){
  try{
    const db=await openInvoiceDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction('files','readonly');
      const req=tx.objectStore('files').getAll();
      req.onsuccess=()=>resolve(req.result||[]);
      req.onerror=()=>reject(req.error);
    });
  }catch(e){return []}
}
async function restoreAttachmentRecord(rec){
  const db=await openInvoiceDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readwrite');
    tx.objectStore('files').put(rec);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
function getDriveAttachmentMap(){
  try{return JSON.parse(localStorage.getItem('maisonDriveAttachmentMap')||'{}')}catch(e){return {}}
}
function setDriveAttachmentMap(m){localStorage.setItem('maisonDriveAttachmentMap',JSON.stringify(m))}
async function uploadAttachmentsToDrive(rootFolderId){
  const attachmentFolder=await driveEnsureFolder(DRIVE_ATTACHMENTS_FOLDER,rootFolderId);
  const locals=await listLocalAttachments();
  const cache=getDriveAttachmentMap();
  const manifest=[];
  for(const rec of locals){
    const safeName=(rec.name||'piece-jointe').replace(/[\\/]/g,'-');
    const driveName=`${rec.id}__${safeName}`;
    const cached=cache[rec.id];
    let driveFileId=cached?.driveFileId||null;
    const signature=`${rec.size||0}|${rec.createdAt||''}|${rec.name||''}`;
    if(!driveFileId || cached.signature!==signature){
      const up=await driveUpsertFile(driveName,attachmentFolder.id,rec.blob,rec.type||'application/octet-stream');
      driveFileId=up.id;
      cache[rec.id]={driveFileId,signature};
    }
    manifest.push({id:rec.id,name:rec.name||safeName,type:rec.type||'',size:rec.size||0,createdAt:rec.createdAt||'',driveFileId});
  }
  setDriveAttachmentMap(cache);
  return manifest;
}
function roundBackup(n,d=3){
  if(n===null||n===undefined||Number.isNaN(Number(n))) return null;
  const f=10**d;
  return Math.round((Number(n)+Number.EPSILON)*f)/f;
}
function backupPaidByCurrency(){
  const out={};
  for(const e of state.expenses){
    const v=Number(e.paidAmount||0);
    if(v<=0) continue;
    const c=e.currency||'TND';
    out[c]=roundBackup((out[c]||0)+v,3);
  }
  return out;
}
function backupExpenseReadable(e){
  const rem=remainingNative(e);
  return {
    id:e.id,
    description:e.description||'',
    fournisseur:e.supplier||'',
    categorie:e.type||'',
    statut:e.status||'',
    devise:e.currency||'TND',
    montantMarche:e.contractAmount===null||e.contractAmount===''||e.contractAmount===undefined?null:roundBackup(e.contractAmount,3),
    montantPaye:roundBackup(e.paidAmount||0,3),
    resteAPayer:rem===null?null:roundBackup(rem,3),
    tauxTNDUtilise:roundBackup(rateFor(e),6),
    equivalentMarcheTND:contractTnd(e)===null?null:roundBackup(contractTnd(e),3),
    equivalentPayeTND:paidTnd(e)===null?null:roundBackup(paidTnd(e),3),
    equivalentResteTND:remainingTnd(e)===null?null:roundBackup(remainingTnd(e),3),
    equivalentUSD:e.usdEquivalent===null||e.usdEquivalent===undefined?null:roundBackup(e.usdEquivalent,3),
    date:e.date||'',
    notes:e.notes||'',
    pieceJointe:e.attachmentId?{id:e.attachmentId,nom:e.attachmentName||'Pièce jointe'}:null
  };
}
function buildReadableLots(){
  return allLots().map(lot=>{
    const expenses=state.expenses.filter(e=>e.lot===lot);
    const budget=Number(state.lotBudgets?.[lot]||0);
    if(!expenses.length && !budget) return null;
    return {
      lot,
      budgetTND:roundBackup(budget,3),
      totalPayeTND:roundBackup(sum(expenses.map(e=>paidTnd(e)||0)),3),
      resteConnuTND:roundBackup(sum(expenses.map(e=>remainingTnd(e)||0)),3),
      nombreDepenses:expenses.length,
      depenses:expenses.map(backupExpenseReadable)
    };
  }).filter(Boolean);
}
function buildBackupV2(attachments=[]){
  const t=totals();
  return {
    format:'cout-maison-backup-v2',
    version:2,
    application:'Coût Maison',
    createdAt:new Date().toISOString(),
    resume:{
      totalPayeTND:roundBackup(t.paid,3),
      resteConnuTND:roundBackup(t.remaining,3),
      materielPayeTND:roundBackup(t.material,3),
      mainOeuvrePayeeTND:roundBackup(t.labor,3),
      mixtePayeTND:roundBackup(t.mixed,3),
      devisNonConfirmesTND:roundBackup(t.quotes,3),

    },

    },

    })),

    }
  };
}
function backupCSV(){
  const head=['Lot','Catégorie','Fournisseur','Description','Statut','Devise','Montant marché','Payé','Reste à payer','Taux TND','Marché TND','Payé TND','Reste TND','Date','Pièce jointe','Notes'];
  const rows=state.expenses.map(e=>[
    e.lot,e.type,e.supplier||'',e.description||'',e.status,e.currency,
    e.contractAmount??'',e.paidAmount??0,remainingNative(e)??'',rateFor(e)||'',
    contractTnd(e)??'',paidTnd(e)??'',remainingTnd(e)??'',e.date||'',e.attachmentName||'',e.notes||''
  ]);
  return '\ufeff'+[head,...rows].map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(';')).join('\n');
}
async function buildDriveBackup(rootFolderId){
  const attachments=await uploadAttachmentsToDrive(rootFolderId);

}
async function saveToGoogleDrive({silent=false,history=true}={}){
  if(driveBusy) return;
  driveBusy=true;updateDriveStatus();
  try{
    await ensureDriveToken(!silent);
    const root=await driveEnsureFolder(DRIVE_BACKUP_FOLDER);
    const payload=await buildDriveBackup(root.id);
    const text=JSON.stringify(payload,null,2);
    const current=await driveUpsertFile(DRIVE_CURRENT_BACKUP,root.id,text,'application/json');
    await driveUpsertFile(DRIVE_REPORT_FILE,root.id,backupCSV(),'text/csv;charset=utf-8');
    if(history){
      const stamp=new Date().toISOString().replace(/[:.]/g,'-');
      await driveUpsertFile(`Historique_Cout_Maison_${stamp}.json`,root.id,text,'application/json');
      await pruneDriveHistory(root.id,10);
    }
    const when=current.modifiedTime||new Date().toISOString();
    localStorage.setItem('maisonDriveLastBackup',when);
    updateDriveStatus('Sauvegarde Google Drive terminée ✓');
    if(!silent) alert('Sauvegarde Google Drive terminée.');
  }catch(e){
    console.error(e);
    updateDriveStatus('Erreur Google Drive');
    if(!silent) alert('Sauvegarde Drive impossible : '+(e.message||e));
  }finally{
    driveBusy=false;
    setTimeout(()=>updateDriveStatus(),1800);
  }
}
async function pruneDriveHistory(rootId,keep=10){
  try{
    const q=`'${rootId}' in parents and name contains 'Historique_Cout_Maison_' and trashed=false`;
    const files=await driveFindFiles(q,100);
    for(const f of files.slice(keep)){
      await driveRequest(`https://www.googleapis.com/drive/v3/files/${f.id}`,{method:'DELETE'});
    }
  }catch(e){console.warn('Historique Drive non nettoyé',e)}
}
async function restoreFromGoogleDrive(){
  if(!confirm('Restaurer la dernière sauvegarde Google Drive ? Les données actuelles de cet appareil seront remplacées après confirmation.'))return;
  driveBusy=true;updateDriveStatus();
  try{
    await ensureDriveToken(true);
    const root=await driveEnsureFolder(DRIVE_BACKUP_FOLDER);
    let f=await driveFindFileByName(DRIVE_CURRENT_BACKUP,root.id);
    if(!f) f=await driveFindFileByName(DRIVE_LEGACY_BACKUP,root.id);
    if(!f) throw new Error('Aucune sauvegarde Coût Maison trouvée dans Google Drive.');
    const r=await driveRequest(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
    const backup=await r.json();
    const restoredState=backup?.restauration?.state||backup?.state||backup;
    if(!restoredState?.expenses||!restoredState?.settings) throw new Error('Sauvegarde invalide.');
    const backupAttachments=Array.isArray(backup.piecesJointes)?backup.piecesJointes.map(a=>({id:a.id,name:a.nom,type:a.type,size:a.tailleOctets,createdAt:a.dateAjout,driveFileId:a.driveFileId})):backup.attachments;
    if(Array.isArray(backupAttachments)){
      for(const a of backupAttachments){
        if(!a.driveFileId) continue;
        try{
          const ar=await driveRequest(`https://www.googleapis.com/drive/v3/files/${a.driveFileId}?alt=media`);
          const blob=await ar.blob();
          await restoreAttachmentRecord({id:a.id,name:a.name||'piece-jointe',type:a.type||blob.type,size:a.size||blob.size,blob,createdAt:a.createdAt||new Date().toISOString()});
        }catch(err){console.warn('Pièce jointe non restaurée',a.id,err)}
      }
    }
    state=restoredState;
    localStorage.setItem('maisonCostStateV3',JSON.stringify(state));
    localStorage.setItem('maisonDriveLastBackup',f.modifiedTime||new Date().toISOString());
    renderCurrent();
    updateDriveStatus('Restauration terminée ✓');
    alert('Données restaurées depuis Google Drive.');
  }catch(e){
    console.error(e);
    updateDriveStatus('Erreur Google Drive');
    alert('Restauration impossible : '+(e.message||e));
  }finally{
    driveBusy=false;
    setTimeout(()=>updateDriveStatus(),1800);
  }
}

    await ensureDriveToken(true);

    alert('Connexion Google Drive impossible : '+(e.message||e));
  }
}

}

      Ouvre l'application depuis <strong>Safari</strong>, appuie sur le bouton <strong>Partager</strong>,
      puis choisis <strong>Sur l’écran d’accueil</strong>. L'application s'ouvrira ensuite comme une app.
    </div>
  </div>

  <div class="card section">
    <div class="section-title"><h2>Facture AI</h2></div>
    <div class="help">Les PDF texte sont analysés directement. Pour les images et les PDF scannés, l'OCR prend en charge le français, l'anglais et l'arabe et utilise un moteur de reconnaissance de texte chargé depuis Internet. Les fichiers joints sont conservés localement dans le navigateur via IndexedDB et restent liés à la dépense sur cet appareil.</div>
  </div>
  <div class="card section">
    <div class="section-title"><h2>Robot vocal</h2></div>
    <div class="help">Le micro peut être réglé sur Français, English ou العربية. Chrome/Edge offrent généralement la meilleure compatibilité. Si le micro n'est pas disponible, le Robot Chantier fonctionne aussi avec du texte dicté ailleurs puis collé dans l'application.</div>
  </div>`;
}
function setRate(key,v){
  state.settings[key]=v===''?null:Number(v); persist();
  if(currentTab==='dashboard')renderDashboard();
}
function saveBudget(lot){
  const el=document.getElementById('budget-'+slug(lot)); if(!el)return;
  state.lotBudgets[lot]=Number(el.value||0);persist();renderLots();
}
function populateLotSelect(){
  const sel=document.getElementById('f-lot');
  sel.innerHTML=allLots().map(l=>`<option>${esc(l)}</option>`).join('');
}
function openExpenseModal(){
  populateLotSelect();
  document.getElementById('expenseForm').reset();
  document.getElementById('f-id').value='';
  document.getElementById('f-attachmentid').value='';
  document.getElementById('f-attachmentname').value='';
  document.getElementById('f-attachment-wrap').style.display='none';
  document.getElementById('f-paid').value='0';
  document.getElementById('f-currency').value='TND';
  document.getElementById('f-status').value='Payé';
  document.getElementById('modalTitle').textContent='Ajouter une dépense';
  toggleRateFields();
  document.getElementById('expenseModal').classList.add('open');
}
function closeExpenseModal(){document.getElementById('expenseModal').classList.remove('open')}
function toggleRateFields(){
  const c=document.getElementById('f-currency').value;
  document.getElementById('customRateWrap').style.display=c==='TND'?'none':'flex';
  document.getElementById('usdEqWrap').style.display=(c==='QAR')?'flex':'none';
}
function editExpense(id){
  const e=state.expenses.find(x=>x.id===id);if(!e)return;
  populateLotSelect();
  document.getElementById('f-id').value=e.id;
  document.getElementById('f-attachmentid').value=e.attachmentId||'';
  document.getElementById('f-attachmentname').value=e.attachmentName||'';
  const aw=document.getElementById('f-attachment-wrap');
  const al=document.getElementById('f-attachment-label');
  if(e.attachmentId){aw.style.display='flex'; al.textContent=e.attachmentName||'Facture jointe';}
  else aw.style.display='none';
  document.getElementById('f-lot').value=e.lot;
  document.getElementById('f-type').value=e.type;
  document.getElementById('f-supplier').value=e.supplier||'';
  document.getElementById('f-status').value=e.status;
  document.getElementById('f-description').value=e.description;
  document.getElementById('f-contract').value=e.contractAmount??'';
  document.getElementById('f-paid').value=e.paidAmount??0;
  document.getElementById('f-currency').value=e.currency;
  document.getElementById('f-date').value=e.date||'';
  document.getElementById('f-customrate').value=e.customRate??'';
  document.getElementById('f-usdeq').value=e.usdEquivalent??'';
  document.getElementById('f-notes').value=e.notes||'';
  document.getElementById('modalTitle').textContent='Modifier la dépense';
  toggleRateFields();
  document.getElementById('expenseModal').classList.add('open');
}
function saveExpense(ev){
  ev.preventDefault();
  const id=document.getElementById('f-id').value||('e'+Date.now());
  const contractRaw=document.getElementById('f-contract').value;
  const obj={
    id,
    lot:document.getElementById('f-lot').value,
    type:document.getElementById('f-type').value,
    supplier:document.getElementById('f-supplier').value.trim(),
    status:document.getElementById('f-status').value,
    description:document.getElementById('f-description').value.trim(),
    contractAmount:contractRaw===''?null:Number(contractRaw),
    paidAmount:Number(document.getElementById('f-paid').value||0),
    currency:document.getElementById('f-currency').value,
    date:document.getElementById('f-date').value,
    customRate:document.getElementById('f-customrate').value===''?null:Number(document.getElementById('f-customrate').value),
    usdEquivalent:document.getElementById('f-usdeq').value===''?null:Number(document.getElementById('f-usdeq').value),
    notes:document.getElementById('f-notes').value.trim(),
    attachmentId:document.getElementById('f-attachmentid').value||null,
    attachmentName:document.getElementById('f-attachmentname').value||null
  };
  const idx=state.expenses.findIndex(x=>x.id===id);
  if(idx>=0) state.expenses[idx]={...state.expenses[idx],...obj}; else state.expenses.push(obj);
  persist();closeExpenseModal();renderCurrent();
}
function deleteExpense(id){
  const e=state.expenses.find(x=>x.id===id);if(!e)return;
  if(confirm(`Supprimer « ${e.description} » ?`)){
    state.expenses=state.expenses.filter(x=>x.id!==id);persist();renderCurrent();
  }
}
function exportJSON(){
  const backup=buildBackupV2([]);
  const stamp=new Date().toISOString().slice(0,10);
  downloadBlob(JSON.stringify(backup,null,2),`Cout_Maison_BACKUP_${stamp}.json`,'application/json');
}
function exportCSV(){
  const stamp=new Date().toISOString().slice(0,10);
  downloadBlob(backupCSV(),`Cout_Maison_RAPPORT_${stamp}.csv`,'text/csv;charset=utf-8');
}
function downloadBlob(text,name,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      const restored=obj?.restauration?.state||obj?.state||obj;
      if(!restored?.expenses||!restored?.settings)throw new Error();
      state=restored;persist();renderCurrent();alert('Sauvegarde importée.');
    }catch(e){alert('Fichier de sauvegarde invalide.')}
  };r.readAsText(file);
}
function resetData(){
  if(confirm('Réinitialiser toutes les données et revenir aux dépenses de départ ?')){
    state=clone(INITIAL_STATE);persist();renderCurrent();
  }
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function slug(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase()}
function jsq(s){return String(s).replaceAll("\\","\\\\").replaceAll("'","\\'")}
populateLotSelect();
renderDashboard();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
